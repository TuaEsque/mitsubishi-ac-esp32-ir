; Two firmwares from one project:
;   pio run -e capture    -t upload    print what the real remote sends
;   pio run -e controller -t upload    HTTP API that replaces the remote
;
; Board: any ESP32 dev board. For an ESP8266 D1 mini change platform/board in
; [env] to `espressif8266` / `d1_mini` and the pins in include/config.h
; (D5 = GPIO14 for the receiver, D2 = GPIO4 for the LED are fine).

[platformio]
default_envs = controller

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    crankyoldgit/IRremoteESP8266@^2.8.6
build_flags =
    ; Protocol to send, pick what `capture` reports for YOUR remote:
    ;   MITSUBISHI_AC          Mitsubishi Electric, 144-bit (MSZ-/MSY-/MFZ- ...)
    ;   MITSUBISHI112          Mitsubishi Electric, 112-bit (some MSZ-/MLZ- remotes)
    ;   MITSUBISHI_HEAVY_88    Mitsubishi Heavy Industries (SRK/SRC ...)
    ;   MITSUBISHI_HEAVY_152   Mitsubishi Heavy Industries (SRK/SRC ...)
    -DAC_PROTOCOL=MITSUBISHI_AC
    ; Uncomment to override the pins from include/config.h
    ; -DIR_LED_PIN=4
    ; -DIR_RECV_PIN=14

[env:capture]
build_src_filter = -<*> +<capture.cpp>

[env:controller]
build_src_filter = -<*> +<controller.cpp>
