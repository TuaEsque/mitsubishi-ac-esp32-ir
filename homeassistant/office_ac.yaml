# Optional Home Assistant package for the ESPHome "Office AC" device.
#
# You do NOT need this file to get the device: Home Assistant discovers the
# ESPHome board on its own (Settings -> Devices & services -> ESPHome). This
# package only adds an example automation that uses the device's climate entity.
#
# Install:
#   1. Copy to /config/packages/office_ac.yaml
#   2. In configuration.yaml, make sure packages are enabled:
#        homeassistant:
#          packages: !include_dir_named packages
#   3. Developer tools -> YAML -> Check configuration, then restart.
#
# The entity id below assumes the ESPHome config is unchanged (device name
# office-ac, climate `name: None`). Check it under the device's page.

automation:
  - id: office_ac_off_evening
    alias: Office AC - off at 19:00 on weekdays
    triggers:
      - trigger: time
        at: "19:00:00"
    conditions:
      - condition: time
        weekday: [mon, tue, wed, thu, fri]
    # No "only if it is on" condition on purpose: the IR state is a best guess,
    # and sending "off" to a unit that is already off does no harm.
    actions:
      - action: climate.turn_off
        target:
          entity_id: climate.office_ac
