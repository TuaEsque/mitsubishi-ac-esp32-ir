# Office AC: ESPHome firmware for the ESP32 + IR LED + IR receiver.
#
# Home Assistant discovers this as a device called "Office AC" with:
#   - a climate entity (mode, set point, fan) that sends Mitsubishi Electric IR
#   - diagnostics: Wi-Fi signal, uptime, online status, firmware version
#   - a restart button
#
# Validated with `esphome config` on ESPHome 2026.10.1 (no errors, no warnings).
# Not yet compiled or flashed, and not yet tested against the MSZ-HR35VF.
#
# secrets.yaml (ESPHome's own file, not committed) needs:
#   wifi_ssid, wifi_password, fallback_ap_password, api_key
# Generate api_key with:  python -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"

substitutions:
  # Any temperature sensor already in Home Assistant. It only feeds the
  # "current temperature" on the thermostat card. If it does not exist the card
  # just shows no room temperature; nothing else breaks.
  room_temperature_entity: sensor.office_temperature

esphome:
  name: office-ac
  friendly_name: Office AC

esp32:
  board: esp32dev        # DOIT ESP32 DevKit V1 (30-pin)

logger:

api:
  encryption:
    key: !secret api_key

# A bare `encryption:` reuses the API key above, so there is no separate OTA
# password to manage.
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If the board cannot join Wi-Fi it starts its own hotspot ("Office AC
  # Fallback") with a page for entering new Wi-Fi details.
  ap:
    password: !secret fallback_ap_password

captive_portal:

# IR LED stage: GPIO4 -> 470R -> transistor base (see final-build-guide.md).
remote_transmitter:
  id: ir_tx
  pin: GPIO4
  carrier_duty_percent: 50%
  non_blocking: true

# TSOP38238 on GPIO14. Linked to the climate entity below, so presses on the
# real remote that this receiver sees update the state in Home Assistant.
remote_receiver:
  id: ir_rx
  pin:
    number: GPIO14
    inverted: true
    mode:
      input: true
      pullup: true
  # While commissioning, uncomment to print every frame the receiver sees.
  # dump: all

sensor:
  - platform: homeassistant
    id: room_temperature
    entity_id: ${room_temperature_entity}
    internal: true

  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: Uptime
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: Status

text_sensor:
  - platform: version
    name: Firmware version

button:
  - platform: restart
    name: Restart

climate:
  - platform: mitsubishi
    # `None` makes this the device's main entity: it is named "Office AC"
    # and gets the id climate.office_ac.
    name: None
    transmitter_id: ir_tx
    receiver_id: ir_rx
    sensor: room_temperature
    supports_cool: true
    supports_heat: true
    supports_dry: true
    supports_fan_only: true
    # Fan speeds on the remote, excluding auto. Options: 3levels (default),
    # 4levels, quiet_4levels. Set this to match your remote.
    set_fan_mode: 3levels
