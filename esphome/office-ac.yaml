# Office AC: ESPHome firmware for the ESP32 + IR LED + IR receiver + SHT40.
#
# Home Assistant discovers this as a device called "Office AC" with:
#   - a climate entity (mode, set point, fan) that sends Mitsubishi Electric IR,
#     showing the room temperature and humidity from the SHT40
#   - Temperature and Humidity sensors (SHT40 on its own lead)
#   - diagnostics: Wi-Fi signal, uptime, online status, firmware version
#   - a restart button
#
# IR part running on the ESP32 since 2026-11-02 (ESPHome 2026.10.1) and
# commissioned on the soldered board on 2026-11-05. The SHT40 section was added
# on 2026-11-14 and validated with `esphome config`; not yet on the board.
#
# secrets.yaml (ESPHome's own file, not committed) needs:
#   wifi_ssid, wifi_password, fallback_ap_password, api_key
# Generate api_key with:  python -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"

substitutions:
  # Calibration for the SHT40, in degrees C. Leave at 0.0 unless it reads
  # consistently off against a trusted thermometer placed next to it (after an
  # hour to settle). A positive reading error needs a negative offset.
  temperature_offset: "0.0"

esphome:
  name: office-ac
  friendly_name: Office AC

esp32:
  board: esp32dev        # DOIT ESP32 DevKit V1 (30-pin)

logger:

api:
  encryption:
    key: !secret api_key

# A bare `encryption:` reuses the API key above, so there is no separate OTA
# password to manage.
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If the board cannot join Wi-Fi it starts its own hotspot ("Office AC
  # Fallback") with a page for entering new Wi-Fi details.
  ap:
    password: !secret fallback_ap_password

captive_portal:

# IR LED stage: GPIO4 -> 470R -> transistor base (see final-build-guide.md).
remote_transmitter:
  id: ir_tx
  pin: GPIO4
  carrier_duty_percent: 50%
  non_blocking: true

# TSOP38238 on GPIO14. Linked to the climate entity below, so presses on the
# real remote that this receiver sees update the state in Home Assistant.
remote_receiver:
  id: ir_rx
  pin:
    number: GPIO14
    inverted: true
    mode:
      input: true
      pullup: true
  # While commissioning, uncomment to print every frame the receiver sees.
  # dump: all

# I2C bus for the SHT40. The ESP32 can put I2C on almost any GPIO; these two
# sit next to free holes on the perfboard (RX2 = GPIO16 at K6, D18 = GPIO18 at
# K9), so no wire has to cross the board. Neither is a boot strapping pin. The
# Adafruit breakout has its own 10k pull-ups, which matter more than the ESP32's
# weak internal ones on a 20-30 cm lead.
i2c:
  id: i2c_bus
  sda: GPIO16
  scl: GPIO18
  frequency: 100kHz
  # Logs the address of every device found at boot. Expect 0x44 for the SHT40.
  scan: true

sensor:
  - platform: sht4x
    address: 0x44
    update_interval: 60s
    temperature:
      id: room_temperature
      name: Temperature
      accuracy_decimals: 1
      filters:
        - offset: ${temperature_offset}
    humidity:
      id: room_humidity
      name: Humidity
      accuracy_decimals: 0

  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: Uptime
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: Status

text_sensor:
  - platform: version
    name: Firmware version

button:
  - platform: restart
    name: Restart

climate:
  - platform: mitsubishi
    # `None` makes this the device's main entity: it is named "Office AC"
    # and gets the id climate.office_ac.
    name: None
    transmitter_id: ir_tx
    receiver_id: ir_rx
    # Current temperature and humidity on the thermostat card, from the SHT40.
    sensor: room_temperature
    humidity_sensor: room_humidity
    supports_cool: true
    supports_heat: true
    supports_dry: true
    supports_fan_only: true
    # The remote has speeds 1-4 plus auto. Mapping confirmed on the unit:
    #   1 = low, 2 = medium, 3 = middle, 4 = high
    # Note "medium" is BELOW "middle". Use these names in automations.
    set_fan_mode: 4levels
    # Let the unit choose the vane angle, as the real remote does. Without this
    # ESPHome sends a fixed middle position (byte 9 0x58 instead of 0x40).
    vertical_default: auto
